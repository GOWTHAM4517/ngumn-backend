spring.application.name=ngumn-backend

# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
# Most hosts (Render, Railway, Heroku-style platforms) pick a port for
# you and tell the app which one via $PORT; SERVER_PORT is kept as a
# fallback for hosts/setups that use that name instead, and 8080 stays
# the default for local dev.
server.port=${PORT:${SERVER_PORT:8080}}

# ------------------------------------------------------------------
# MySQL Database (set these as environment variables - never hardcode
# real credentials here). Defaults below assume a local MySQL with a
# "ngumn" database already created:
#   CREATE DATABASE ngumn;
#
# For a hosted database (Aiven, TiDB Cloud, etc.), it's usually simplest
# to set DB_URL to the exact JDBC connection string the provider's
# console gives you (it will already include the right host, port and
# TLS parameters for that provider) instead of DB_HOST/DB_PORT/DB_NAME.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ngumn}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# A managed database's own connection proxy/load-balancer often closes
# connections that sit idle longer than its own timeout, which HikariCP
# wouldn't otherwise notice until a request failed on a dead connection.
# Recycling pooled connections well before that (25 min) and testing one
# before handing it out avoids random "communications link failure"
# errors against a host neither Aiven nor TiDB Cloud runs on your own
# network.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.connection-test-query=SELECT 1

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# NGUMN application settings
# ------------------------------------------------------------------
# Demo mode simulates vehicles/hazards/emergencies without real
# hardware or multiple physical devices. Simulated data is always
# tagged isSimulated=true so it is never confused with real sensor
# data.
ngumn.demo-mode.enabled=${DEMO_MODE:true}

# Seeded admin login (DataSeeder), created once on first boot against an
# empty database. CHANGE ADMIN_SEED_PASSWORD before deploying anywhere
# reachable from the public internet - "admin123" is printed right here
# in the source, so leaving it default hands out an admin account to
# anyone who finds this repo. Changing it later only affects the NEXT
# fresh database; it does not reset an admin that already exists.
ngumn.admin.seed-email=${ADMIN_SEED_EMAIL:admin@ngumn.local}
ngumn.admin.seed-password=${ADMIN_SEED_PASSWORD:admin123}

# JWT secret for auth tokens (prototype-grade auth, not production).
# MUST be overridden via env var for anything beyond local dev.
ngumn.jwt.secret=${JWT_SECRET:ngumn-prototype-dev-secret-change-me-please-32chars}
# 90 days (was 24 hours) - the mobile app persists its session on-device
# (see ngumn-app/src/lib/auth-context.tsx) so people stay logged in like
# a normal daily-use app; a short server-side token expiry defeated that
# by silently invalidating the saved session every day. No refresh-token
# flow exists (prototype-grade auth), so this is a deliberately long
# fixed expiry rather than a sliding one - acceptable for a prototype,
# not for production.
ngumn.jwt.expiration-ms=${JWT_EXPIRATION_MS:7776000000}

# Prototype risk-engine thresholds. These are NOT scientifically
# validated values - they are configurable demo parameters so the
# risk engine's behaviour can be tuned/explained in the viva.
ngumn.risk.nearby-radius-meters=${RISK_NEARBY_RADIUS_M:300}
ngumn.risk.overspeed-margin-kmh=${RISK_OVERSPEED_MARGIN_KMH:10}
ngumn.risk.high-risk-score=${RISK_HIGH_SCORE:70}
ngumn.risk.medium-risk-score=${RISK_MEDIUM_SCORE:40}

# Traffic-rule monitor (RuleMonitorService): km/h above a mapped zone's
# limit before it counts as over-speeding - absorbs GPS speed error.
ngumn.rules.overspeed-tolerance-kmh=${RULES_OVERSPEED_TOLERANCE_KMH:5}
# Outside mapped speed zones the real limit isn't known, so nothing is
# recorded - but NGUMN drivers within 700 m are warned ("Speeding vehicle
# nearby") about any vehicle going at least this fast.
ngumn.rules.nearby-warning-speed-kmh=${RULES_NEARBY_WARNING_SPEED_KMH:80}

# Google Maps API key (mobile app reads its own copy via env/app.json;
# this one is only used if the backend ever needs server-side maps
# calls, e.g. route lookups). Leave blank to run in map-fallback mode.
ngumn.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ------------------------------------------------------------------
# MQTT (used by MqttConfig; point to a local Mosquitto broker for dev)
# ------------------------------------------------------------------
ngumn.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
ngumn.mqtt.client-id=${MQTT_CLIENT_ID:ngumn-backend}
ngumn.mqtt.username=${MQTT_USERNAME:}
ngumn.mqtt.password=${MQTT_PASSWORD:}
ngumn.mqtt.enabled=${MQTT_ENABLED:false}

# ------------------------------------------------------------------
# CORS - allow the Expo dev server / mobile app to call the API
# ------------------------------------------------------------------
ngumn.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.com.ngumn.backend=${LOG_LEVEL:INFO}
